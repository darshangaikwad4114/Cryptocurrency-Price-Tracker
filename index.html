<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-init.js"></script>

    <!-- Primary Meta Tags -->
    <title>Crypto Tracker | Live Crypto Prices, News &amp; Portfolio</title>
    <meta
      name="description"
      content="Track live cryptocurrency prices, charts, market categories, and news. A private, account-free dashboard with a local watchlist, portfolio, and price alerts."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a192f" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crypto Tracker" />
    <meta property="og:title" content="Crypto Tracker | Live Crypto Prices, News &amp; Portfolio" />
    <meta
      property="og:description"
      content="Live prices, charts, market structure, and news — with a private watchlist, portfolio, and price alerts stored in your browser."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Crypto Tracker | Live Crypto Prices, News &amp; Portfolio" />
    <meta
      name="twitter:description"
      content="A private, account-free crypto dashboard with live prices, charts, market data, and news."
    />

    <!-- CANONICAL -->

    <link rel="preconnect" href="https://assets.coingecko.com" crossorigin />
    <link rel="dns-prefetch" href="https://assets.coingecko.com" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
